<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>连通性检测面板</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#16213e 0%,#0a0e14 60%);color:#e5e7eb;min-height:100vh;padding:40px 20px;display:flex;flex-direction:column;align-items:center;}
  .wrap{width:100%;max-width:960px}
  h1{font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-.02em}
  .sub{margin-top:6px;color:#9ca3af;font-size:14px}
  .panel{margin-top:24px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px}
  textarea{width:100%;min-height:120px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#f9fafb;padding:14px;font-size:14.5px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;outline:none;line-height:1.6;}
  textarea:focus{border-color:#22c55e}
  textarea::placeholder{color:#6b7280}
  .actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{background:#22c55e;color:#052e16;border:none;padding:11px 22px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  button.secondary{background:rgba(255,255,255,.08);color:#e5e7eb}
  button:hover{opacity:.9}
  button:disabled{opacity:.5;cursor:not-allowed}
  .summary{font-size:13.5px;color:#9ca3af;margin-left:auto}
  .summary b{color:#4ade80}
  .summary b.warn{color:#fbbf24}
  .summary b.bad{color:#f87171}
  .grid{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .site{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .site .top{display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:#4b5563}
  .dot.ok{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.6)}
  .dot.bad{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.6)}
  .dot.warn{background:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,.6)}
  .dot.run{background:#9ca3af;box-shadow:0 0 8px rgba(156,163,175,.6);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.4}}
  .site .name{font-size:14px;font-weight:600;word-break:break-all;flex:1}
  .site .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:13px}
  .code.ok{color:#4ade80}
  .code.bad{color:#f87171}
  .code.warn{color:#fbbf24}
  .site .row{display:flex;justify-content:space-between;color:#9ca3af;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .site .loc{color:#cbd5e1;font-size:12.5px;line-height:1.5}
  .site .loc b{color:#e5e7eb;font-weight:600}
  .site .detail{color:#9ca3af;font-size:11.5px;line-height:1.5;border-top:1px dashed rgba(255,255,255,.08);padding-top:6px}
  .history{margin-top:32px}
  .history h3{font-size:12px;color:#9ca3af;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#d1d5db;padding:6px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;}
  .tag:hover{background:rgba(34,197,94,.2);border-color:#22c55e}
  footer{margin-top:40px;color:#6b7280;font-size:12.5px;text-align:center;line-height:1.7}
  footer a{color:#9ca3af;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>站点连通性检测面板</h1>
  <div class="sub">三层检测：DNS 解析 · HTTP 状态码 · 服务器位置（多源交叉验证）</div>
  <div class="panel">
    <textarea id="input" placeholder="每行输入一个域名或 URL，例如：&#10;baidu.com&#10;github.com&#10;zhihu.com&#10;this-domain-does-not-exist-12345.com"></textarea>
    <div class="actions">
      <button id="runBtn">开始批量检测</button>
      <button class="secondary" id="clearBtn">清空</button>
      <span class="summary" id="summary"></span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="history">
    <h3>常用站点（点击加入输入框）</h3>
    <div class="tags" id="tags"></div>
  </div>
  <footer>DNS: Cloudflare DoH + Google DoH 交叉验证 · 地理位置: ipwho.is · 仓库: <a href="https://github.com/georgezhou2024/georgezhou2024.github.io" target="_blank">link</a></footer>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
var presets = ['baidu.com','github.com','google.com','zhihu.com','doubao.com','bilibili.com','weibo.com','taobao.com','jd.com','youtube.com'];
function normalize(s){
  s = (s || '').trim();
  if(!s) return null;
  if(s.indexOf('http://') !== 0 && s.indexOf('https://') !== 0) s = 'https://' + s;
  try{ return new URL(s).href; }catch(e){ return null; }
}
function getHost(url){ try{ return new URL(url).hostname; }catch(e){ return url; } }

// 1) DNS-over-HTTPS 真实验证域名是否解析
async function probeDns(host){
  var sources = [
    'https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(host) + '&type=A',
    'https://dns.google/resolve?name=' + encodeURIComponent(host) + '&type=A'
  ];
  var ips = [];
  for(var i=0;i<sources.length;i++){
    try{
      var r = await fetch(sources[i], {headers:{Accept:'application/dns-json'}});
      var j = await r.json();
      if(j.Status === 0 && j.Answer){
        for(var k=0;k<j.Answer.length;k++){
          if(j.Answer[k].type === 1 && ips.indexOf(j.Answer[k].data) === -1) ips.push(j.Answer[k].data);
        }
      }
    }catch(e){}
  }
  return ips;
}

// 2) 通过 CORS 代理拿真实 HTTP 状态码（多代理交叉）
async function probeHttp(url){
  var t0 = performance.now();
  var proxies = [
    function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
    function(u){ return 'https://corsproxy.io/?url=' + encodeURIComponent(u); }
  ];
  for(var i=0;i<proxies.length;i++){
    try{
      var r = await fetch(proxies[i](url), {redirect:'follow'});
      var body = await r.text();
      // 识别代理自身的错误页
      if(body.indexOf('Could not resolve') !== -1 || body.indexOf('404 Not Found') !== -1 && body.length < 500){
        // 可能是代理错误，继续试下一个
        continue;
      }
      return { status: r.status, ms: (performance.now()-t0).toFixed(0) };
    }catch(e){}
  }
  return { status: 'PROXY_FAIL', ms: (performance.now()-t0).toFixed(0) };
}

// 3) 服务器位置
async function probeGeo(host, dnsIps){
  try{
    var q = dnsIps && dnsIps.length ? dnsIps[0] : host;
    var r = await fetch('https://ipwho.is/' + q + '?lang=zh-CN');
    var j = await r.json();
    if(j.success === false) return null;
    return { country: j.country, city: j.city, isp: j.connection && j.connection.isp, org: j.connection && j.connection.org, ip: j.ip };
  }catch(e){ return null; }
}

function makeCard(url){
  var el = document.createElement('div');
  el.className = 'site';
  var display = url.replace('https://','').replace('http://','');
  el.innerHTML =
    '<div class="top"><span class="dot run"></span><span class="name">'+display+'</span><span class="code">...</span></div>' +
    '<div class="row"><span>检测中</span><span>-</span></div>' +
    '<div class="loc"><b>三层检测中...</b></div>' +
    '<div class="detail"></div>';
  return el;
}

// 综合判定：dnsIps 数组 + http 状态码
function judge(dnsIps, http){
  if(!dnsIps.length){
    return { level:'bad', label:'DNS 解析失败', code:'NXDOMAIN' };
  }
  if(http.status === 'PROXY_FAIL'){
    return { level:'warn', label:'DNS 通 · HTTP 代理不可达', code:'PROXY' };
  }
  if(typeof http.status === 'number'){
    if(http.status >= 200 && http.status < 400){
      return { level:'ok', label:'正常访问', code:http.status };
    }
    if(http.status === 404){
      return { level:'warn', label:'服务器返回 404', code:404 };
    }
    if(http.status >= 500){
      return { level:'bad', label:'服务器错误 ' + http.status, code:http.status };
    }
    return { level:'warn', label:'HTTP ' + http.status, code:http.status };
  }
  return { level:'warn', label:'未知', code:'?' };
}

function setCard(el, url, dnsIps, http, geo){
  var dot = el.querySelector('.dot');
  var code = el.querySelector('.code');
  var row = el.querySelector('.row');
  var loc = el.querySelector('.loc');
  var detail = el.querySelector('.detail');
  var j = judge(dnsIps, http);
  dot.className = 'dot ' + j.level;
  code.className = 'code ' + j.level;
  code.textContent = j.code;
  row.firstElementChild.textContent = http.ms + ' ms';
  row.lastElementChild.textContent = new URL(url).protocol.replace(':','').toUpperCase();

  if(dnsIps.length){
    var parts = [];
    if(geo){
      if(geo.country) parts.push(geo.country);
      if(geo.city) parts.push(geo.city);
    }
    var line = '<b>' + (parts.join(' · ') || '未知位置') + '</b>';
    if(geo && geo.isp) line += '<br>' + geo.isp;
    loc.innerHTML = line;
    detail.innerHTML = 'DNS: ' + dnsIps.slice(0,3).join(', ') + (dnsIps.length > 3 ? ' 等 ' + dnsIps.length + ' 个 IP' : '');
  }else{
    loc.innerHTML = '<b style="color:#f87171">域名无法解析</b><br><span style="color:#6b7280">Cloudflare + Google DoH 均未返回 A 记录</span>';
    detail.innerHTML = 'HTTP: ' + j.label;
  }
}

async function run(){
  var lines = $('input').value.split(String.fromCharCode(10)).map(normalize).filter(Boolean);
  if(!lines.length){ alert('请先输入至少一个域名'); return; }
  $('runBtn').disabled = true;
  $('grid').innerHTML = '';
  $('summary').innerHTML = '';
  var cards = lines.map(function(u){ var c = makeCard(u); $('grid').appendChild(c); return {u:u,c:c}; });
  var okCount = 0, warnCount = 0, badCount = 0;
  await Promise.all(cards.map(async function(item){
    var host = getHost(item.u);
    var dnsIps = await probeDns(host);
    var results = await Promise.all([probeHttp(item.u), probeGeo(host, dnsIps)]);
    var http = results[0], geo = results[1];
    setCard(item.c, item.u, dnsIps, http, geo);
    var j = judge(dnsIps, http);
    if(j.level === 'ok') okCount++; else if(j.level === 'warn') warnCount++; else badCount++;
    $('summary').innerHTML = '✅ <b>'+okCount+'</b> 正常 · 🟡 <b class="warn">'+warnCount+'</b> 异常 · ❌ <b class="bad">'+badCount+'</b> 失败 / 共 '+lines.length+' 个';
  }));
  $('runBtn').disabled = false;
}

function renderTags(){
  var box = $('tags'); box.innerHTML = '';
  presets.forEach(function(p){
    var t = document.createElement('span');
    t.className = 'tag'; t.textContent = p;
    t.onclick = function(){
      var v = $('input').value.trim();
      $('input').value = v ? v + String.fromCharCode(10) + p : p;
    };
    box.appendChild(t);
  });
}
$('runBtn').addEventListener('click', run);
$('clearBtn').addEventListener('click', function(){
  $('input').value = ''; $('grid').innerHTML = ''; $('summary').textContent = '';
});
$('input').value = location.hostname;
renderTags();
</script>
</body>
</html>
