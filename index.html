<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>DNS 连通性 + 网速测速面板 v4</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#16213e 0%,#0a0e14 60%);color:#e5e7eb;min-height:100vh;padding:40px 20px;display:flex;flex-direction:column;align-items:center;}
  .wrap{width:100%;max-width:960px}
  .title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-.02em}
  .ver{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:rgba(34,197,94,.15);color:#4ade80;padding:4px 10px;border-radius:999px;border:1px solid rgba(34,197,94,.3)}
  .sub{margin-top:6px;color:#9ca3af;font-size:14px}
  .section{margin-top:28px}
  .section h2{font-size:18px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px}
  textarea{width:100%;min-height:120px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#f9fafb;padding:14px;font-size:14.5px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;outline:none;line-height:1.6;}
  textarea:focus{border-color:#22c55e}
  textarea::placeholder{color:#6b7280}
  .actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{background:#22c55e;color:#052e16;border:none;padding:11px 22px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  button.secondary{background:rgba(255,255,255,.08);color:#e5e7eb}
  button.blue{background:#3b82f6;color:#fff}
  button:hover{opacity:.9}
  button:disabled{opacity:.5;cursor:not-allowed}
  .summary{font-size:13.5px;color:#9ca3af;margin-left:auto}
  .summary b{color:#4ade80}
  .summary b.warn{color:#fbbf24}
  .summary b.bad{color:#f87171}
  .grid{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .site{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
  .site .top{display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:#4b5563}
  .dot.ok{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.6)}
  .dot.bad{background:#ef4444;box-shadow:0 0 8px rgba(239,68,68,.6)}
  .dot.warn{background:#fbbf24;box-shadow:0 0 8px rgba(251,191,36,.6)}
  .dot.run{background:#9ca3af;box-shadow:0 0 8px rgba(156,163,175,.6);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.4}}
  .site .name{font-size:14px;font-weight:600;word-break:break-all;flex:1}
  .site .badge{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;}
  .badge.ok{background:rgba(34,197,94,.15);color:#4ade80}
  .badge.bad{background:rgba(239,68,68,.15);color:#f87171}
  .badge.warn{background:rgba(251,191,36,.15);color:#fbbf24}
  .site .row{display:flex;justify-content:space-between;color:#9ca3af;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .site .detail{color:#cbd5e1;font-size:12.5px;line-height:1.6;border-top:1px dashed rgba(255,255,255,.08);padding-top:8px}
  .site .detail b{color:#e5e7eb}
  /* speed block */
  .speed-display{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
  .speed-card{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;text-align:center}
  .speed-card .k{font-size:12px;color:#9ca3af;text-transform:uppercase;letter-spacing:.08em}
  .speed-card .v{margin-top:6px;font-size:28px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace;color:#f9fafb}
  .speed-card .u{font-size:13px;color:#9ca3af;margin-left:4px}
  .speed-card .sub2{margin-top:4px;font-size:11.5px;color:#6b7280}
  .bar{margin-top:14px;height:8px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}
  .bar > div{height:100%;background:linear-gradient(90deg,#22c55e,#3b82f6);width:0%;transition:width .3s}
  .history{margin-top:20px}
  .history h3{font-size:12px;color:#9ca3af;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#d1d5db;padding:6px 12px;border-radius:999px;font-size:12.5px;cursor:pointer;}
  .tag:hover{background:rgba(34,197,94,.2);border-color:#22c55e}
  footer{margin-top:40px;color:#6b7280;font-size:12.5px;text-align:center;line-height:1.7}
  footer a{color:#9ca3af;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="title-row">
    <h1>DNS 连通性 + 网速测速面板</h1>
    <span class="ver">v4 · 内置测速</span>
  </div>
  <div class="sub">浏览器原生探测 · 内置 Cloudflare 下行测速 · 可跳转 speedtest.cn 对比</div>

  <!-- 测速区 -->
  <div class="section">
    <h2>🚀 网速测试</h2>
    <div class="panel">
      <div class="actions">
        <button id="speedBtn">开始测速（下载 25MB）</button>
        <button class="secondary" onclick="window.open('https://www.speedtest.cn/','_blank')">在 speedtest.cn 中打开 ↗</button>
        <span class="summary" id="speedStatus"></span>
      </div>
      <div class="bar"><div id="speedBar"></div></div>
      <div class="speed-display">
        <div class="speed-card"><div class="k">下载速度</div><div class="v" id="dlSpeed">--<span class="u">Mbps</span></div><div class="sub2" id="dlInfo">等待测速</div></div>
        <div class="speed-card"><div class="k">耗时</div><div class="v" id="dlTime">--<span class="u">s</span></div><div class="sub2" id="dlSize">-</div></div>
        <div class="speed-card"><div class="k">对比参考</div><div class="v" style="font-size:16px;line-height:1.6;color:#9ca3af" id="dlRef">100M 宽带 ≈ 100Mbps<br>500M 宽带 ≈ 500Mbps</div><div class="sub2">以 speedtest.cn 为标准</div></div>
      </div>
    </div>
  </div>

  <!-- DNS 检测区 -->
  <div class="section">
    <h2>🌐 域名连通性检测</h2>
    <div class="panel">
      <textarea id="input" placeholder="每行输入一个域名，例如：&#10;baidu.com&#10;github.com&#10;this-domain-does-not-exist-zzz999.com"></textarea>
      <div class="actions">
        <button id="runBtn">开始批量检测</button>
        <button class="secondary" id="clearBtn">清空</button>
        <span class="summary" id="summary"></span>
      </div>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="history">
    <h3>常用站点（点击加入输入框）</h3>
    <div class="tags" id="tags"></div>
  </div>

  <footer>v4 · 下载测速源: speed.cloudflare.com · 对比标准: <a href="https://www.speedtest.cn/" target="_blank">speedtest.cn</a> · 仓库：<a href="https://github.com/georgezhou2024/georgezhou2024.github.io" target="_blank">link</a></footer>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
var presets = ['baidu.com','github.com','google.com','zhihu.com','doubao.com','bilibili.com','weibo.com','taobao.com','jd.com','youtube.com'];

// ==== 测速 ====
async function runSpeed(){
  var btn = $('speedBtn');
  btn.disabled = true; btn.textContent = '测速中...';
  $('speedStatus').innerHTML = '正在从 Cloudflare 拉取 25MB ...';
  $('speedBar').style.width = '0%';
  var bytes = 25 * 1000 * 1000; // 25MB
  var url = 'https://speed.cloudflare.com/__down?bytes=' + bytes + '&_=' + Date.now();
  var t0 = performance.now();
  try{
    var resp = await fetch(url);
    var reader = resp.body.getReader();
    var received = 0;
    while(true){
      var chunk = await reader.read();
      if(chunk.done) break;
      received += chunk.value.length;
      var elapsed = (performance.now() - t0) / 1000;
      var pct = Math.min(100, received / bytes * 100);
      $('speedBar').style.width = pct + '%';
      var mbps = received * 8 / 1000 / 1000 / Math.max(elapsed, 0.1);
      $('dlSpeed').innerHTML = mbps.toFixed(1) + '<span class="u">Mbps</span>';
    }
    var elapsed = (performance.now() - t0) / 1000;
    var mbps = received * 8 / 1000 / 1000 / elapsed;
    $('dlSpeed').innerHTML = mbps.toFixed(1) + '<span class="u">Mbps</span>';
    $('dlTime').innerHTML = elapsed.toFixed(2) + '<span class="u">s</span>';
    $('dlSize').textContent = (received/1000/1000).toFixed(1) + ' MB';
    $('dlInfo').textContent = '下载于 ' + new Date().toLocaleTimeString();
    $('speedStatus').innerHTML = '✅ 测速完成 · <b>' + mbps.toFixed(1) + ' Mbps</b>';
  }catch(e){
    $('speedStatus').innerHTML = '<span style="color:#f87171">测速失败：' + e.message + '</span>';
  }
  btn.disabled = false; btn.textContent = '开始测速（下载 25MB）';
}
$('speedBtn').addEventListener('click', runSpeed);

// ==== DNS 检测 ====
function getHost(url){
  url = (url || '').trim();
  if(!url) return null;
  if(url.indexOf('http://') !== 0 && url.indexOf('https://') !== 0) url = 'https://' + url;
  try{ return new URL(url).hostname; }catch(e){ return url; }
}
function probeHost(host){
  return new Promise(function(resolve){
    var url = 'https://' + host + '/favicon.ico?_=' + Date.now();
    var started = performance.now();
    var settled = false;
    var timeout = setTimeout(finish, 6000);
    function finish(result){ if(settled) return; settled = true; clearTimeout(timeout); result.ms = (performance.now() - started).toFixed(0); resolve(result); }
    var img = new Image();
    img.onload = function(){ finish({ dns: true, reachable: true, httpOk: true }); };
    img.onerror = function(){
      var entries = performance.getEntriesByName(url);
      if(entries.length > 0){ finish({ dns: true, reachable: true, httpOk: false }); }
      else{
        fetch('https://' + host + '/?_=' + Date.now(), {mode:'no-cors', cache:'no-store'})
          .then(function(){ finish({ dns: true, reachable: true, httpOk: false }); })
          .catch(function(){ finish({ dns: false, reachable: false, httpOk: false }); });
      }
    };
    img.src = url;
  });
}
function makeCard(host){
  var el = document.createElement('div'); el.className = 'site';
  el.innerHTML = '<div class="top"><span class="dot run"></span><span class="name">'+host+'</span><span class="badge">检测中</span></div><div class="row"><span>-</span><span>等待</span></div><div class="detail">正在解析 DNS ...</div>';
  return el;
}
function setCard(el, host, r){
  var dot = el.querySelector('.dot'), badge = el.querySelector('.badge'), row = el.querySelector('.row'), detail = el.querySelector('.detail');
  var level, label, msg;
  if(r.dns && r.httpOk){ level='ok'; label='可达'; msg='<b>DNS 解析成功 · 服务器返回了内容</b>'; }
  else if(r.dns){ level='warn'; label='DNS OK'; msg='<b>DNS 解析成功 · TCP 可达</b><br>但服务器未返回有效资源（可能 404 / 拒绝跨域图片）'; }
  else{ level='bad'; label='NXDOMAIN'; msg='<b style="color:#f87171">DNS 解析失败</b><br>该域名无法被系统解析为 IP（域名不存在或被污染）'; }
  dot.className = 'dot ' + level;
  badge.className = 'badge ' + level; badge.textContent = label;
  row.firstElementChild.textContent = r.ms + ' ms';
  row.lastElementChild.textContent = r.dns ? 'HTTPS' : '-';
  detail.innerHTML = msg;
}
async function run(){
  var hosts = $('input').value.split(String.fromCharCode(10)).map(getHost).filter(Boolean);
  if(!hosts.length){ alert('请先输入至少一个域名'); return; }
  $('runBtn').disabled = true; $('grid').innerHTML=''; $('summary').innerHTML='';
  var cards = hosts.map(function(h){ var c = makeCard(h); $('grid').appendChild(c); return {h:h,c:c}; });
  var okCount=0, warnCount=0, badCount=0;
  await Promise.all(cards.map(async function(item){
    var r = await probeHost(item.h); setCard(item.c, item.h, r);
    if(r.dns && r.httpOk) okCount++; else if(r.dns) warnCount++; else badCount++;
    $('summary').innerHTML = '✅ <b>'+okCount+'</b> 可达 · 🟡 <b class="warn">'+warnCount+'</b> DNS通但无内容 · ❌ <b class="bad">'+badCount+'</b> 无法解析 / 共 '+hosts.length+' 个';
  }));
  $('runBtn').disabled = false;
}
function renderTags(){
  var box = $('tags'); box.innerHTML='';
  presets.forEach(function(p){
    var t = document.createElement('span'); t.className='tag'; t.textContent=p;
    t.onclick = function(){ var v = $('input').value.trim(); $('input').value = v ? v + String.fromCharCode(10) + p : p; };
    box.appendChild(t);
  });
}
$('runBtn').addEventListener('click', run);
$('clearBtn').addEventListener('click', function(){ $('input').value=''; $('grid').innerHTML=''; $('summary').textContent=''; });
$('input').value = location.hostname;
renderTags();
</script>
</body>
</html>
